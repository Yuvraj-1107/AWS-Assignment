<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Registration Form</title>
    <meta name="description" content="This is just a basic college registration form website">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <h1>COLLEGE REGISTRATION FORM</h1>
        <div class="text"><b>Name:-</b><input type="text" placeholder="Enter your name"></div>
        <div class="text"><b>Roll Number:-</b><input type="number" placeholder="Enter your Roll Number"></div>
        <div class="text"><b>Email:-</b><input type="email" placeholder="Enter your email address"></div>
        <div class="text"><b>Password:-</b><input type="password" placeholder="Enter your email password"></div>
        <div class="text"><b>Gender:-</b> Male<input type="radio" >Female<input type="radio" placeholder="Enter your Gender" ></div>
        <div class="text"><b>Course DropDown:-</b><input type="text" placeholder="Enter your Course Dropdown"></div>
        <div class="text"><b>Date of Birth:-</b><input type="date" placeholder="Enter your name"></div>
        <div class="text"><b>Address:-</b><input type="text" placeholder="Enter Your Full Address"></div>
        <div class="bu">
            <button type="submit" class="bmd">Submit</button>
            <button type="reset" class="bmd">Reset</button>
        </div>
    </div>
</body>
</html>
